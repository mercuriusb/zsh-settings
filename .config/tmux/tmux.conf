# =============================================================
#  ~/.config/tmux/tmux.conf
#  Base setup + Alt bindings that work without the prefix.
#  Requires tmux 3.2+ (display-popup, bind -N).
#
#  Every binding carries a -N description. Those strings show up
#  in "prefix ?" and in the M-F1 popup, so they are the actual
#  documentation -- comments only cover what needs explaining.
# =============================================================


# -------------------------------------------------------------
#  1. Prefix
# -------------------------------------------------------------

set -g prefix C-a
unbind C-b
bind -N "Send a literal Ctrl-a to the program below" C-a send-prefix
                                  # needed because Ctrl-a moves to the start
                                  # of the line in the shell


# -------------------------------------------------------------
#  2. Shell
# -------------------------------------------------------------

set -g default-shell /bin/zsh     # adjust if zsh lives elsewhere:
                                  # check with "command -v zsh"

# "default-command" is deliberately left unset. With it empty, tmux
# starts default-shell as a LOGIN shell by itself, so ~/.zprofile and
# ~/.zshenv are read either way.
#
# Do not set it to "${SHELL} -l": tmux expands ${SHELL} at parse time
# from the environment of whoever started the server, not from
# default-shell. Start the server from bash and every pane runs bash,
# no matter what default-shell says -- default-command wins.
#
# On macOS a login shell also runs /etc/zprofile, which calls
# path_helper and REORDERS the PATH. Put PATH tweaks in ~/.zshrc,
# not in ~/.zprofile, or they get shuffled.


# -------------------------------------------------------------
#  3. General behaviour
# -------------------------------------------------------------

set -g mouse on                   # click panes, scroll, drag borders
set -g base-index 1               # number windows from 1 instead of 0
setw -g pane-base-index 1
set -g renumber-windows on        # close gaps after killing a window
set -g history-limit 50000        # scrollback per pane (default: 2000)
set -sg escape-time 0             # otherwise Vim lags when leaving insert mode
set -g focus-events on            # lets Vim notice externally changed files
set -g display-time 2000
set -g set-titles on


# -------------------------------------------------------------
#  4. Colours
# -------------------------------------------------------------

# "tmux-256color" is the correct entry, but stock macOS ships an ncurses
# that does not have it -- tmux then aborts with "missing or unsuitable
# terminal". screen-256color exists everywhere, so fall back to it.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# True colour. The old ",xterm-256color:RGB" in terminal-overrides matched
# that ONE terminal exactly -- Kitty, Alacritty, WezTerm, foot and Ghostty
# report different TERM values and silently stayed at 256 colours, which is
# the "washed out" look this is meant to prevent. terminal-features is the
# supported form since tmux 3.2.
#
# A whitelist on purpose, not "*:RGB": claiming RGB on a genuine 8-colour
# terminal (Linux console, vt100) makes it print escape garbage.
set -as terminal-features ",*256col*:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",foot*:RGB"
set -as terminal-features ",ghostty:RGB"


# =============================================================
#  5. ALT BINDINGS -- no prefix needed
#     "-n" means: fires directly, without Ctrl-a first
#     "M-" is Meta, i.e. the Alt key
# =============================================================

# --- Panes: navigation ---------------------------------------
bind -N "Focus pane left"         -n M-h select-pane -L
bind -N "Focus pane down"         -n M-j select-pane -D
bind -N "Focus pane up"           -n M-k select-pane -U
bind -N "Focus pane right"        -n M-l select-pane -R

# --- Panes: create, zoom, close ------------------------------
bind -N "Split vertically (new pane right)" \
  -n M-Enter split-window -h -c "#{pane_current_path}"
bind -N "Split horizontally (new pane below)" \
  -n M-v     split-window -v -c "#{pane_current_path}"
bind -N "Toggle pane zoom" \
  -n M-z     resize-pane -Z
bind -N "Kill pane (no confirmation)" \
  -n M-q     kill-pane
                                  # to ask first, use instead:
                                  # bind -n M-q confirm-before -p "kill pane? (y/n)" kill-pane

# --- Panes: resize (Alt + Shift) -----------------------------
bind -N "Shrink width by 5"       -n M-H resize-pane -L 5
bind -N "Grow height by 3"        -n M-J resize-pane -D 3
bind -N "Shrink height by 3"      -n M-K resize-pane -U 3
bind -N "Grow width by 5"         -n M-L resize-pane -R 5

# --- Windows -------------------------------------------------
bind -N "Go to window 1" -n M-1 select-window -t 1
bind -N "Go to window 2" -n M-2 select-window -t 2
bind -N "Go to window 3" -n M-3 select-window -t 3
bind -N "Go to window 4" -n M-4 select-window -t 4
bind -N "Go to window 5" -n M-5 select-window -t 5
bind -N "Go to window 6" -n M-6 select-window -t 6
bind -N "Go to window 7" -n M-7 select-window -t 7
bind -N "Go to window 8" -n M-8 select-window -t 8
bind -N "Go to window 9" -n M-9 select-window -t 9
bind -N "New window (in current directory)" \
  -n M-c new-window -c "#{pane_current_path}"
bind -N "Back to last window" \
  -n M-o last-window

# --- Overview and scrolling ----------------------------------
bind -N "Browse sessions and windows" \
  -n M-w  choose-tree -Zs
bind -N "Enter copy mode (scroll, search, copy)" \
  -n M-Up copy-mode

# --- Help popups ---------------------------------------------
#
#  "Alt-Shift-?" cannot be bound. The ? character is already produced
#  by Shift (German layout: Shift+ss); the terminal only transmits the
#  finished character, so the Shift information is already consumed.
#  M-? IS Alt+Shift. Hence M-F1 for the second popup -- layout
#  independent and unbound everywhere.

# Picks the viewer at runtime rather than at parse time, so the same
# config works on a machine that has glow and on one that does not.
# glow is not in the Debian/Ubuntu repos, so a fresh WSL or server
# install has none -- and display-popup -E on a missing command leaves
# nothing but an empty popup. less is the floor: it is always there.
bind -N "Show cheat sheet" \
  -n M-? display-popup -E -w 80% -h 85% -T " Cheat Sheet " \
  'f="$HOME/.config/tmux/cheatsheet.md"; if command -v glow >/dev/null 2>&1; then glow -p "$f"; elif command -v batcat >/dev/null 2>&1; then batcat --style=plain --paging=always "$f"; elif command -v bat >/dev/null 2>&1; then bat --style=plain --paging=always "$f"; else less "$f"; fi'

bind -N "Search bindings and run one" \
  -n M-P display-popup -E -w 80% -h 70% -T " Bindings " \
  "~/.config/tmux/keyhelp.sh"
                                  # lists exactly the -N strings from this
                                  # file, so it is always in sync.
                                  # Enter runs the selected command.
                                  # Plain list without the script:
                                  #   "{ tmux list-keys -N -T root; tmux list-keys -N -T prefix; } | less"

# Fallbacks in case the terminal swallows M-?:
# bind -N "Show cheat sheet" -n M-F2 display-popup -E -w 80% -h 85% "glow -p ~/.config/tmux/cheatsheet.md"
# bind -N "Show cheat sheet" -n M-i  display-popup -E -w 80% -h 85% "glow -p ~/.config/tmux/cheatsheet.md"


# -------------------------------------------------------------
#  Alt keys deliberately left alone -- zsh (ZLE) uses them:
#    M-b  M-f     backward-word / forward-word
#    M-d          kill-word
#    M-.  M-_     insert-last-word
#    M-n  M-p     history-search-forward / backward
#    M-t          transpose-words
#    M-u          up-case-word
#    M-y          yank-pop
#    M-x          execute-named-cmd
#    M-Backspace  backward-kill-word
#    M-Tab        usually grabbed by the window manager
#
#  Taken over from zsh by the bindings above:
#    M-q  push-line              M-h  run-help
#    M-w  copy-region-as-kill    M-z  execute-last-named-cmd
#    M-l  down-case-word         M-c  capitalize-word
#
#  Only push-line is worth keeping. Move it in ~/.zshrc:
#    bindkey '^[e' push-line     # was M-q
#    bindkey '^[r' run-help      # was M-h
#  Free Alt keys in zsh: e i j k m o r v and 1-9
#  List your own with:  bindkey -e; bindkey | grep '\^\['
# -------------------------------------------------------------


# =============================================================
#  6. PREFIX BINDINGS -- used less often
# =============================================================

bind -N "Reload config" \
  r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- Splits with memorable characters ------------------------
unbind '"'
unbind %
bind -N "Split vertically (new pane right)" \
  | split-window -h -c "#{pane_current_path}"
bind -N "Split horizontally (new pane below)" \
  - split-window -v -c "#{pane_current_path}"
bind -N "New window (in current directory)" \
  c new-window -c "#{pane_current_path}"

# --- Move windows around -------------------------------------
bind -N "Move window left" \
  -r H swap-window -t -1 \; select-window -t -1
bind -N "Move window right" \
  -r L swap-window -t +1 \; select-window -t +1
                                  # -r = repeatable without pressing the
                                  # prefix again

# --- Extras --------------------------------------------------
bind -N "Toggle input to all panes" \
  S setw synchronize-panes \; display "sync #{?pane_synchronized,on,off}"
bind -N "lazygit in a popup" \
  g display-popup -E -w 80% -h 80% "lazygit"


# -------------------------------------------------------------
#  7. Copy mode with Vim keys
# -------------------------------------------------------------

setw -g mode-keys vi              # hjkl, /, ?, gg, G in copy mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# System clipboard -- uncomment the line for your platform:
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"       # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel c" # X11
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"      # Wayland


# -------------------------------------------------------------
#  8. Status line
# -------------------------------------------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]%d.%m. %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour39,bold] #I:#W#{?window_zoomed_flag, [Z],} "
                                  # #S = session, #I = window index,
                                  # #W = window name, [Z] = zoomed
set -g pane-active-border-style "fg=colour39"
set -g pane-border-style "fg=colour238"


# =============================================================
#  macOS: the Option key must send Meta for the Alt bindings
#  to work at all.
#    iTerm2:       Profiles > Keys > General
#                    Left Option key:  Esc+
#                    Right Option key: Normal   <- keep this one!
#    Terminal.app: Settings > Keyboard >
#                  "Use Option as Meta key"
#
#  Set the LEFT one only. On a German (and most non-US) layout the
#  Option key is what types ~ @ | \ { } [ ], so switching BOTH to Meta
#  removes those characters from the keyboard:
#    ~ Option+N then Space    @ Option+L        | Option+7
#    { } Option+8 / +9        [ ] Option+5 / +6   \ Option+Shift+7
#  Terminal.app has no left/right split, so there it is all or nothing --
#  another reason to prefer iTerm2 with this config.
# =============================================================